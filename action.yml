name: LLM Diff Review
description: Review a pull request diff with Anthropic and upsert one summary comment
inputs:
  anthropic-api-key:
    description: Anthropic API key
    required: true
  github-token:
    description: GitHub Actions token with pull-requests write permission
    default: ${{ github.token }}
  model:
    description: Anthropic model ID
    default: claude-sonnet-5-5
  max-chars:
    description: Maximum diff characters per request
    default: '60000'
  ignore:
    description: Additional comma- or newline-separated ignore globs
    default: ''
  fail-on:
    description: Set to high to fail when a high-severity finding exists
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LLM_DIFF_REVIEW_MODEL: ${{ inputs.model }}
        LLM_DIFF_REVIEW_MAX_CHARS: ${{ inputs.max-chars }}
        LLM_DIFF_REVIEW_IGNORE: ${{ inputs.ignore }}
        LLM_DIFF_REVIEW_FAIL_ON: ${{ inputs.fail-on }}
      run: python -m llm_diff_review
